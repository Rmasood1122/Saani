[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saani"
version = "1.2.0"
description = "Saani - a personal multi-agent AI system that works on your computer the way you would."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
voice = ["sounddevice", "numpy", "faster-whisper", "pyttsx3"]
desktop = ["pyautogui", "pillow"]
secure = ["keyring"]
window = ["pywebview"]
all = ["sounddevice", "numpy", "faster-whisper", "pyttsx3", "pyautogui", "pillow", "keyring", "pywebview"]

[project.scripts]
saani = "saani.cli:main"

[tool.setuptools.packages.find]
include = ["saani*"]

[tool.setuptools.package-data]
saani = ["*.html", "assets/*.png"]
